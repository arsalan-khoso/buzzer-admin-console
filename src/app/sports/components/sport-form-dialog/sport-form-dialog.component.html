<div class="dialog-backdrop"></div>
<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="sport-form-title">
  <h2 id="sport-form-title" class="dialog__title">{{ sport() ? 'Edit Sport' : 'Add Sport' }}</h2>

  <form class="dialog__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label class="field__label" for="sport-name">Name*</label>
      <input
        id="sport-name"
        class="input"
        [class.input--invalid]="showError('name')"
        formControlName="name"
        placeholder="Name"
      />
      @if (showError('name')) {
        <p class="field__error">Name is required.</p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="sport-description">Description</label>
      <textarea
        id="sport-description"
        class="input"
        formControlName="description"
        placeholder="Description"
      ></textarea>
    </div>

    <div class="field">
      <label class="field__label" for="sport-icon">Icon URL</label>
      <input
        id="sport-icon"
        class="input"
        [class.input--invalid]="showError('iconUrl')"
        formControlName="iconUrl"
        placeholder="https://"
      />
      @if (showError('iconUrl')) {
        <p class="field__error">Enter a valid URL starting with http:// or https://.</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="dialog__error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="dialog__actions">
      <button type="button" class="btn" (click)="closed.emit()">Cancel</button>
      <button type="submit" class="btn btn--primary" [disabled]="isSaving()">
        {{ sport() ? 'Save' : 'Add Sport' }}
      </button>
    </div>
  </form>
</section>
