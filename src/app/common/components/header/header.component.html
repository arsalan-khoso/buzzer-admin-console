<header class="header">
  <h1 class="header__title">{{ title() }}</h1>

  <div class="header__search" role="search">
    <img
      class="header__search-icon"
      [src]="iconsPath + '/ic_search.svg'"
      width="18"
      height="18"
      alt=""
      aria-hidden="true"
    />
    <input
      class="header__search-field"
      type="search"
      placeholder="Search"
      aria-label="Search"
      [value]="searchQuery()"
      (input)="onSearch($event)"
    />
    @if (searchQuery()) {
      <button
        type="button"
        class="header__clear-btn"
        (click)="clearSearch()"
        aria-label="Clear search"
      >
        <img [src]="iconsPath + '/ic_close.svg'" width="16" height="16" alt="" aria-hidden="true" />
      </button>
    }
  </div>
</header>
